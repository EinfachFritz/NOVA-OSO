
name: Build NOVA OS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib binutils grub-pc-bin xorriso mtools

      - name: Build NOVA OS
        run: |
          mkdir -p build/boot/grub
          gcc -m32 -c BOOT.S -o build/boot.o
          gcc -m32 -ffreestanding -fno-pie -fno-stack-protector -c KERNEL.C -o build/kernel.o
          ld -m elf_i386 -T linker.ld -o build/boot/kernel.elf build/boot.o build/kernel.o
          cp grub.cfg build/boot/grub/grub.cfg
          grub-mkrescue -o build/nova-os.iso build

      - name: Check bootable kernel
        run: grub-file --is-x86-multiboot build/boot/kernel.elf

      - name: Save NOVA OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: nova-os
          path: build/nova-os.iso
